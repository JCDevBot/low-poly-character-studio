name: Release Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and deliver Studio artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Style Studio
        run: pnpm studio:build

      - name: Package Studio
        run: tar -C apps/style-studio/dist -czf "style-studio-${GITHUB_REF_NAME}.tar.gz" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: style-studio-${{ github.ref_name }}
          path: style-studio-${{ github.ref_name }}.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "style-studio-${GITHUB_REF_NAME}.tar.gz"
          --generate-notes
          --title "${GITHUB_REF_NAME}"
