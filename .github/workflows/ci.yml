name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-build:
    name: Build Style Studio
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test model type contracts
        run: pnpm model-types:test

      - name: Test persistent build jobs
        run: pnpm build-jobs:test

      - name: Test reference analysis
        run: pnpm reference-analysis:test

      - name: Test humanoid model runner
        run: pnpm model-runner:test

      - name: Build Style Studio
        run: pnpm studio:build

  source-validation:
    name: Validate scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Test humanoid StyleDNA contracts
        run: python3 packages/asset-compiler/blender/tests/test_style_dna.py

      - name: Compile Python sources
        run: python3 -m compileall -q packages/asset-compiler/blender/generator packages/asset-compiler/blender/scripts
