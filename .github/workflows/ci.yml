name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-build:
    name: Build Style Studio
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test model type contracts
        run: pnpm model-types:test

      - name: Test modular pipeline artifact contracts
        run: pnpm pipeline-contracts:test

      - name: Test semantic reference analysis
        run: pnpm semantic-analysis:test

      - name: Test persistent build jobs
        run: pnpm build-jobs:test

      - name: Test reference analysis
        run: pnpm reference-analysis:test

      - name: Test animation clip catalog
        run: pnpm animation-catalog:test

      - name: Test humanoid model runner
        run: pnpm model-runner:test

      - name: Test humanoid rig runner
        run: pnpm rig-runner:test

      - name: Test humanoid animation runner
        run: pnpm animation-runner:test

      - name: Build Style Studio
        run: pnpm studio:build

  source-validation:
    name: Validate scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Test humanoid StyleDNA contracts
        run: python3 packages/asset-compiler/blender/tests/test_style_dna.py

      - name: Test humanoid rig contracts
        run: python3 packages/asset-compiler/blender/tests/test_rig_contract.py

      - name: Test localized underarm web weights
        run: python3 packages/asset-compiler/blender/tests/test_underarm_web_weights.py

      - name: Test humanoid animation pack contracts
        run: python3 packages/asset-compiler/blender/tests/test_animation_pack.py

      - name: Compile Python sources
        run: python3 -m compileall -q packages/asset-compiler/blender/generator packages/asset-compiler/blender/scripts

  blender-rig-smoke:
    name: Blender rig and animation smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Cache Blender toolchain
        uses: actions/cache@v4
        with:
          path: .tools/blender
          key: blender-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.blender-version', 'scripts/setup-blender.sh') }}

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libegl1 \
            libgl1 \
            libice6 \
            libsm6 \
            libx11-6 \
            libxfixes3 \
            libxi6 \
            libxkbcommon0 \
            libxrender1 \
            libxxf86vm1

      - name: Set up pinned Blender
        id: blender
        run: pnpm blender:setup

      - name: Generate compact and tall rig review
        env:
          BLENDER_COMMAND: ${{ steps.blender.outputs.executable }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' pnpm rig-review

      - name: Generate compact and tall animation outputs
        env:
          BLENDER_COMMAND: ${{ steps.blender.outputs.executable }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' bash scripts/run-animation-smoke.sh

      - name: Upload Blender review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-rig-animation-review-${{ github.sha }}
          path: |
            image-analysis/output/pr-21-rig-review.zip
            image-analysis/output/pr-21-rig-review-failed.zip
            image-analysis/output/animation-smoke
          if-no-files-found: warn
          retention-days: 7
